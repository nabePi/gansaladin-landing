<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yayasan Saladin Peradaban Berilmu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --beige: oklch(97% 0.01 60);
      --beige-mid: oklch(93% 0.018 60);
      --beige-dark: oklch(88% 0.025 55);
      --maroon: oklch(38% 0.12 20);
      --maroon-light: oklch(48% 0.12 20);
      --maroon-dark: oklch(28% 0.10 18);
      --gold: oklch(72% 0.12 70);
      --gold-light: oklch(82% 0.10 72);
      --ink: oklch(18% 0.02 50);
      --ink-mid: oklch(40% 0.02 50);
      --ink-light: oklch(60% 0.015 55);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--beige);
      color: var(--ink);
      overflow-x: hidden;
    }

    #root { min-height: 100vh; }

    /* Utility */
    .serif { font-family: 'Playfair Display', serif; }
    .italic { font-style: italic; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--beige-mid); }
    ::-webkit-scrollbar-thumb { background: var(--maroon); border-radius: 3px; }

    /* Transitions */
    * { transition-property: color, background-color, border-color, opacity, transform, box-shadow; transition-duration: 0.2s; transition-timing-function: ease; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">



const { useState, useEffect, useRef, useCallback } = React;

// ─── ICONS ────────────────────────────────────────────────────────────────────
const IconBook = () =>
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
  </svg>;

const IconGlobe = () =>
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="12" cy="12" r="10" /><line x1="2" y1="12" x2="22" y2="12" /><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
  </svg>;

const IconHands = () =>
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
    <path d="M11 17a4 4 0 0 0 4-4V7a2 2 0 1 0-4 0v5.5" />
    <path d="M13 13.5V10a2 2 0 1 1 4 0v3" />
    <path d="M17 13v-1a2 2 0 1 1 4 0v3a6 6 0 0 1-6 6h-2a6 6 0 0 1-4.243-1.757" />
    <path d="M3 21l4.243-4.243" />
    <path d="M9 17H7a2 2 0 0 1-2-2V9a2 2 0 1 1 4 0v4" />
  </svg>;

const IconArrow = ({ dir = "right" }) =>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
style={{ transform: dir === "left" ? "rotate(180deg)" : dir === "down" ? "rotate(90deg)" : "none" }}>
    <line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" />
  </svg>;

const IconMenu = () =>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
    <line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="18" x2="21" y2="18" />
  </svg>;

const IconClose = () =>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
    <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
  </svg>;

const IconStar = () =>
<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
  </svg>;


// ─── GEOMETRIC ORNAMENT ────────────────────────────────────────────────────────
const GeomOrnament = ({ size = 120, color = "var(--maroon)", opacity = 0.08, style = {} }) =>
<svg width={size} height={size} viewBox="0 0 120 120" fill="none" style={{ ...style, opacity, pointerEvents: 'none', flexShrink: 0 }}>
    <polygon points="60,4 116,34 116,86 60,116 4,86 4,34" stroke={color} strokeWidth="1.5" fill="none" />
    <polygon points="60,16 104,40 104,80 60,104 16,80 16,40" stroke={color} strokeWidth="1" fill="none" />
    <circle cx="60" cy="60" r="18" stroke={color} strokeWidth="1" fill="none" />
    <line x1="60" y1="4" x2="60" y2="116" stroke={color} strokeWidth="0.5" />
    <line x1="4" y1="60" x2="116" y2="60" stroke={color} strokeWidth="0.5" />
  </svg>;


// ─── NAVBAR ────────────────────────────────────────────────────────────────────
const navStyle = {
  position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100,
  display: 'flex', alignItems: 'center', justifyContent: 'space-between',
  padding: '0 5vw', height: '68px',
  borderBottom: '1px solid transparent',
  transition: 'all 0.3s ease'
};

function Navbar({ page, setPage }) {
  const [scrolled, setScrolled] = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 20);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const links = [
  { id: 'program', label: 'Program' },
  { id: 'bergabung', label: 'Bergabung' },
  { id: 'dukung', label: 'Dukung Kami' }];


  const navBg = scrolled ?
  'rgba(252,248,244,0.95)' :
  page === 'home' ? 'transparent' : 'rgba(252,248,244,0.95)';
  const navBorder = scrolled || page !== 'home' ?
  '1px solid oklch(88% 0.025 55)' :
  '1px solid transparent';
  const textColor = page === 'home' && !scrolled ? '#fff' : 'var(--ink)';
  const logoColor = page === 'home' && !scrolled ? '#fff' : 'var(--maroon)';

  return (
    <nav style={{ ...navStyle, background: navBg, borderBottom: navBorder, backdropFilter: 'blur(10px)' }}>
      {/* Logo */}
      <button onClick={() => {setPage('home');setMobileOpen(false);}}
      style={{ background: 'none', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center' }}>
        <img
          src={page === 'home' && !scrolled ? 'Logo_GenSa_White.png' : 'Logo_GenSa_Color.png'}
          alt="GenSa — Generasi Shalahuddin"
          style={{ height: '44px', width: 'auto', display: 'block' }} />
        
      </button>

      {/* Desktop Nav */}
      <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
        {links.map((l) =>
        <button key={l.id} onClick={() => setPage(l.id)}
        style={{
          background: 'none', border: 'none', cursor: 'pointer',
          fontSize: '14px', fontWeight: 500, fontFamily: 'DM Sans, sans-serif',
          color: page === l.id ? 'var(--maroon)' : textColor,
          padding: '8px 16px', borderRadius: '4px',
          borderBottom: page === l.id ? '2px solid var(--maroon)' : '2px solid transparent'
        }}>
            {l.label}
          </button>
        )}
        <button onClick={() => setPage('tentang')}
        style={{
          background: page === 'tentang' ? 'var(--maroon)' : 'transparent',
          border: `1.5px solid ${page === 'tentang' ? 'var(--maroon)' : textColor === '#fff' ? 'rgba(255,255,255,0.6)' : 'var(--maroon)'}`,
          color: page === 'tentang' ? '#fff' : textColor === '#fff' ? '#fff' : 'var(--maroon)',
          cursor: 'pointer', fontSize: '14px', fontWeight: 500,
          fontFamily: 'DM Sans, sans-serif',
          padding: '8px 20px', borderRadius: '4px', marginLeft: '8px'
        }}>
          Tentang Kami
        </button>

        {/* Mobile toggle */}
        <button onClick={() => setMobileOpen((v) => !v)}
        style={{ display: 'none', background: 'none', border: 'none', cursor: 'pointer', color: textColor, marginLeft: '8px' }}
        className="mobile-menu-btn">
          {mobileOpen ? <IconClose /> : <IconMenu />}
        </button>
      </div>

      {/* Mobile Menu Overlay */}
      {mobileOpen &&
      <div style={{
        position: 'fixed', inset: 0, top: '68px',
        background: 'var(--beige)', zIndex: 99,
        display: 'flex', flexDirection: 'column', padding: '32px 5vw',
        gap: '24px'
      }}>
          {[...links, { id: 'tentang', label: 'Tentang Kami' }].map((l) =>
        <button key={l.id} onClick={() => {setPage(l.id);setMobileOpen(false);}}
        style={{
          background: 'none', border: 'none', cursor: 'pointer',
          fontSize: '22px', fontWeight: 600, fontFamily: 'Playfair Display, serif',
          color: page === l.id ? 'var(--maroon)' : 'var(--ink)',
          textAlign: 'left', padding: '8px 0',
          borderBottom: '1px solid var(--beige-dark)'
        }}>
              {l.label}
            </button>
        )}
        </div>
      }
    </nav>);

}

// ─── HOME PAGE ──────────────────────────────────────────────────────────────────
function HomePage({ setPage }) {
  return (
    <div>
      {/* HERO */}
      <section style={{
        minHeight: '100vh',
        background: `var(--maroon-dark)`,
        display: 'flex', alignItems: 'center', position: 'relative', overflow: 'hidden',
        padding: '100px 5vw 80px'
      }}>
        {/* Hero background image */}
        <div style={{
          position: 'absolute', inset: 0,
          backgroundImage: `url('hero-bg.png')`,
          backgroundSize: 'cover', backgroundPosition: 'center 40%',
          backgroundRepeat: 'no-repeat'
        }} />
        {/* Dark overlay */}
        <div style={{
          position: 'absolute', inset: 0,
          background: `linear-gradient(160deg, rgba(28,8,6,0.85) 0%, rgba(90,20,15,0.78) 50%, rgba(28,8,6,0.72) 100%)`
        }} />

        {/* Decorative ornament */}
        <div style={{ position: 'absolute', left: '-40px', bottom: '-40px', opacity: 0.05 }}>
          <GeomOrnament size={240} color="#fff" opacity={1} />
        </div>

        {/* Two-column layout */}
        <div style={{
          position: 'relative', zIndex: 2,
          width: '100%', maxWidth: '780px'
        }}>
          <div>
            <div style={{
              display: 'inline-flex', alignItems: 'center', gap: '8px',
              background: 'rgba(255,255,255,0.12)', borderRadius: '2px',
              padding: '6px 16px', marginBottom: '32px',
              border: '1px solid rgba(255,255,255,0.2)'
            }}>
              <span style={{ color: 'var(--gold)', fontSize: '12px' }}>✦</span>
              <span style={{ color: 'rgba(255,255,255,0.85)', fontSize: '12px', letterSpacing: '0.12em', textTransform: 'uppercase', fontWeight: 500 }}>
                Learn History, Repeat Victory
              </span>
            </div>

            <h1 style={{
              fontFamily: 'Playfair Display, serif',
              fontSize: 'clamp(38px, 5.5vw, 76px)',
              fontWeight: 900, color: '#fff',
              lineHeight: 1.05, marginBottom: '28px',
              textWrap: 'pretty'
            }}>
              Membangun Kembali<br />
              <span style={{ color: 'var(--gold)', fontStyle: 'italic' }}>Peradaban Berilmu</span>
            </h1>

            <p style={{
              fontSize: 'clamp(15px, 1.8vw, 18px)',
              color: 'rgba(255,255,255,0.78)',
              lineHeight: 1.75, maxWidth: '520px', marginBottom: '48px',
              fontWeight: 300
            }}>Bayangkan sebuah generasi muda yang kokoh karakternya, dalam ilmunya, dan terinspirasi oleh nilai-nilai peradaban Islam.
Mereka bukan hanya menjadi penonton, tetapi pelaku utama dalam membangun peradaban.
            </p>

            <div style={{ display: 'flex', gap: '16px', flexWrap: 'wrap' }}>
              <button onClick={() => setPage('tentang')} style={{
                background: '#fff', color: 'var(--maroon)',
                border: 'none', cursor: 'pointer',
                padding: '16px 36px', fontSize: '15px', fontWeight: 600,
                fontFamily: 'DM Sans, sans-serif',
                letterSpacing: '0.02em',
                display: 'flex', alignItems: 'center', gap: '10px'
              }}>
                Tentang Kami <IconArrow />
              </button>
              <button onClick={() => setPage('program')} style={{
                background: 'transparent', color: '#fff',
                border: '1.5px solid rgba(255,255,255,0.5)', cursor: 'pointer',
                padding: '16px 36px', fontSize: '15px', fontWeight: 500,
                fontFamily: 'DM Sans, sans-serif',
                letterSpacing: '0.02em'
              }}>
                Mulai Belajar
              </button>
            </div>
          </div>

        </div>

        {/* Scroll indicator */}
        <div style={{
          position: 'absolute', bottom: '32px', left: '50%', transform: 'translateX(-50%)',
          display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '8px',
          color: 'rgba(255,255,255,0.4)', fontSize: '11px', letterSpacing: '0.1em'
        }}>
          <div style={{
            width: '1px', height: '40px',
            background: 'linear-gradient(to bottom, transparent, rgba(255,255,255,0.4))'
          }} />
          <span>SCROLL</span>
        </div>
      </section>

      {/* THREE PILLARS */}
      <section style={{
        padding: 'clamp(80px, 10vw, 140px) 5vw',
        background: 'var(--beige)',
        position: 'relative', overflow: 'hidden'
      }}>
        {/* Background logo sketch */}
        <div style={{
          position: 'absolute', right: '-80px', top: '50%', transform: 'translateY(-50%)',
          width: '520px', height: '520px', opacity: 0.35, pointerEvents: 'none', zIndex: 0
        }}>
          <img src="bg-logo-sk.png" alt="" style={{ width: '100%', height: '100%', objectFit: 'contain' }} />
        </div>

        <div style={{ maxWidth: '1200px', margin: '0 auto' }}>
          <div style={{ maxWidth: '480px', marginBottom: '72px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '20px' }}>
              <div style={{ width: '32px', height: '2px', background: 'var(--maroon)' }} />
              <span style={{ fontSize: '12px', letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--maroon)', fontWeight: 600 }}>
                Tiga Pilar Aktivitas
              </span>
            </div>
            <h2 style={{
              fontFamily: 'Playfair Display, serif', fontSize: 'clamp(32px, 4vw, 52px)',
              fontWeight: 700, color: 'var(--ink)', lineHeight: 1.15
            }}>
              Gerakan yang Berakar,<br />
              <span style={{ fontStyle: 'italic', color: 'var(--maroon)' }}>Berdampak Nyata</span>
            </h2>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '2px' }}>
            {[
            {
              num: '01', icon: <IconBook />, title: 'Pendidikan & Karakter',
              desc: 'Program terstruktur untuk mencetak intelektual berakhlak mulia dan berwawasan luas.',
              detail: 'Kajian non-formal · Seminar & workshop · Pembinaan komunitas pemuda',
              page: 'program'
            },
            {
              num: '02', icon: <IconGlobe />, title: 'Literasi & Dakwah Digital',
              desc: 'Pemanfaatan teknologi untuk menyebarkan ilmu pengetahuan dan nilai-nilai Islam secara relevan.',
              detail: 'Konten multi-platform · Podcast & video edukasi · Arsip digital peradaban',
              page: 'program'
            },
            {
              num: '03', icon: <IconHands />, title: 'Kolaborasi & Aksi Sosial',
              desc: 'Membangun jaringan kebaikan dan menghadirkan dampak nyata di tengah masyarakat.',
              detail: 'Kemitraan strategis · Beasiswa & santunan · Pembinaan komunitas',
              page: 'program'
            }].
            map((p, i) =>
            <PillarCard key={i} {...p} setPage={setPage} />
            )}
          </div>
        </div>
      </section>

      {/* QUOTE BAND */}
      <section style={{
        background: 'var(--maroon)', padding: '80px 5vw',
        position: 'relative', overflow: 'hidden'
      }}>
        {/* Background image */}
        <div style={{
          position: 'absolute', inset: 0,
          backgroundImage: `url('about-visual.png')`,
          backgroundSize: 'cover', backgroundPosition: 'center',
          opacity: 0.12
        }} />
        <div style={{ position: 'absolute', inset: 0, background: 'var(--maroon)', opacity: 0.7 }} />
        <div style={{ maxWidth: '900px', margin: '0 auto', textAlign: 'center', position: 'relative', zIndex: 1 }}>
          <div style={{ color: 'var(--gold)', fontSize: '48px', lineHeight: 1, marginBottom: '24px', opacity: 0.6 }}>"</div>
          <blockquote style={{
            fontFamily: 'Playfair Display, serif',
            fontSize: 'clamp(24px, 4vw, 42px)',
            fontWeight: 600, color: '#fff',
            lineHeight: 1.3, fontStyle: 'italic',
            marginBottom: '24px'
          }}>
            Learn History, Repeat Victory.
          </blockquote>
          <p style={{ color: 'rgba(255,255,255,0.55)', fontSize: '14px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>— JEJAK MENUJU KEMENANGAN

          </p>
        </div>
      </section>

      {/* CTA STRIP */}
      <section style={{
        background: 'var(--beige-mid)', padding: 'clamp(60px, 8vw, 100px) 5vw'
      }}>
        <div style={{ maxWidth: '1200px', margin: '0 auto', display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '32px' }}>
          {[
          {
            label: 'Bergabung', title: 'Jadilah Bagian dari Sejarah',
            desc: 'Pendidik, kreator, atau penggerak komunitas — gerakan ini membutuhkan kontribusimu.',
            btn: 'Lihat Peran', page: 'bergabung', accent: 'var(--maroon)'
          },
          {
            label: 'Dukung Kami', title: 'Dukung Lahirnya Generasi Pembawa Peradaban',
            desc: 'Setiap kontribusimu menjadi bagian dari perjalanan panjang membangun kembali peradaban Islam.',
            btn: 'Dukung Sekarang', page: 'dukung', accent: 'var(--gold)'
          }].
          map((c, i) =>
          <div key={i} style={{
            background: '#fff', padding: '40px',
            borderTop: `3px solid ${c.accent}`,
            position: 'relative'
          }}>
              <div style={{ fontSize: '11px', letterSpacing: '0.12em', textTransform: 'uppercase', color: c.accent, fontWeight: 600, marginBottom: '16px' }}>
                {c.label}
              </div>
              <h3 style={{
              fontFamily: 'Playfair Display, serif', fontSize: '24px', fontWeight: 700,
              color: 'var(--ink)', lineHeight: 1.25, marginBottom: '16px'
            }}>{c.title}</h3>
              <p style={{ fontSize: '15px', color: 'var(--ink-mid)', lineHeight: 1.65, marginBottom: '28px' }}>{c.desc}</p>
              <button onClick={() => setPage(c.page)} style={{
              background: c.accent, color: '#fff', border: 'none', cursor: 'pointer',
              padding: '12px 28px', fontSize: '14px', fontWeight: 600,
              fontFamily: 'DM Sans, sans-serif',
              display: 'flex', alignItems: 'center', gap: '8px'
            }}>
                {c.btn} <IconArrow />
              </button>
            </div>
          )}
        </div>
      </section>

      <Footer setPage={setPage} />
    </div>);

}

function PillarCard({ num, icon, title, desc, detail, setPage, page }) {
  const [hovered, setHovered] = useState(false);
  return (
    <div
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      onClick={() => setPage(page)}
      style={{
        background: hovered ? 'var(--maroon)' : '#fff',
        padding: '48px 40px',
        cursor: 'pointer',
        position: 'relative',
        overflow: 'hidden'
      }}>
      
      <div style={{
        fontSize: '11px', letterSpacing: '0.12em',
        color: hovered ? 'rgba(255,255,255,0.5)' : 'var(--ink-light)',
        fontWeight: 600, marginBottom: '24px'
      }}>{num}</div>
      <div style={{ color: hovered ? 'var(--gold)' : 'var(--maroon)', marginBottom: '20px' }}>{icon}</div>
      <h3 style={{
        fontFamily: 'Playfair Display, serif', fontSize: '22px', fontWeight: 700,
        color: hovered ? '#fff' : 'var(--ink)',
        lineHeight: 1.2, marginBottom: '16px'
      }}>{title}</h3>
      <p style={{
        fontSize: '15px', lineHeight: 1.65,
        color: hovered ? 'rgba(255,255,255,0.75)' : 'var(--ink-mid)',
        marginBottom: '24px'
      }}>{desc}</p>
      <p style={{
        fontSize: '12px', lineHeight: 1.7,
        color: hovered ? 'rgba(255,255,255,0.5)' : 'var(--ink-light)'
      }}>{detail}</p>
      <div style={{
        position: 'absolute', bottom: '24px', right: '24px',
        color: hovered ? 'var(--gold)' : 'var(--beige-dark)'
      }}>
        <IconArrow />
      </div>
    </div>);

}

// ─── TENTANG KAMI PAGE ──────────────────────────────────────────────────────────
function TentangPage({ setPage }) {
  const misi = [

// ─── APP ────────────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState('home');
  const tweaksResult = typeof useTweaks === 'function' ? useTweaks(TWEAK_DEFAULTS) : null;
  const tweaks = tweaksResult?.tweaks || TWEAK_DEFAULTS;
  const setTweak = tweaksResult?.setTweak || (() => {});

  // Apply accent color tweaks
  useEffect(() => {
    const root = document.documentElement;
    if (tweaks.accentColor === 'navy') {
      root.style.setProperty('--maroon', 'oklch(32% 0.10 255)');
      root.style.setProperty('--maroon-light', 'oklch(42% 0.10 255)');
      root.style.setProperty('--maroon-dark', 'oklch(22% 0.08 255)');
    } else if (tweaks.accentColor === 'forest') {
      root.style.setProperty('--maroon', 'oklch(38% 0.12 155)');
      root.style.setProperty('--maroon-light', 'oklch(48% 0.12 155)');
      root.style.setProperty('--maroon-dark', 'oklch(28% 0.10 155)');
    } else {
      root.style.setProperty('--maroon', 'oklch(38% 0.12 20)');
      root.style.setProperty('--maroon-light', 'oklch(48% 0.12 20)');
      root.style.setProperty('--maroon-dark', 'oklch(28% 0.10 18)');
    }
  }, [tweaks.accentColor]);

  const handleSetPage = (p) => {
    setPage(p);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  return (
    <div>
      <Navbar page={page} setPage={handleSetPage} />

      {page === 'home' && <HomePage setPage={handleSetPage} tweaks={tweaks} />}
      {page === 'tentang' && <TentangPage setPage={handleSetPage} />}
      {page === 'program' && <ProgramPage setPage={handleSetPage} />}
      {page === 'ebook' && <EbookPage setPage={handleSetPage} />}
      {page === 'bergabung' && <BergabungPage setPage={handleSetPage} />}
      {page === 'dukung' && <DukungPage setPage={handleSetPage} />}

      <TweaksPanel_App tweaks={tweaks} setTweak={setTweak} />
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
